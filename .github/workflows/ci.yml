name: CI/CD Pipeline & Git Workflow

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-lint:
    name: Automated Testing and Build Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn pyjwt sqlalchemy pytest pytest-asyncio python-multipart bcrypt pydantic python-dotenv

      - name: Run Backend Pytest Suite
        run: |
          pytest tests/ -v

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies & Run Web Build
        run: |
          npm ci
          cd web
          npm ci
          npm run build
